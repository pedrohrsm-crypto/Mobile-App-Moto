name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build e testes
    # Actions hospedado (decisão #10); plano B, se a cobrança da conta bloquear: runner próprio.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Datas e fusos dos testes sempre em UTC, igual em qualquer runner.
      TZ: UTC
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Instala (ou reaproveita) o Android SDK e a plataforma do compileSdk.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Guardas (idioma, cor, texto fixo)
        run: bash ferramentas/guardas.sh

      - name: Formatação (ktlint)
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSAO}/ktlint"
          java -jar "$RUNNER_TEMP/ktlint" "**/*.kt" "**/*.kts" "!**/build/**"
        env:
          KTLINT_VERSAO: 1.7.1

      - name: Testes do buildSrc
        run: ./gradlew -p buildSrc test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build
        run: ./gradlew assembleDebug

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Manifesto do release
        run: ./gradlew verificarManifestoRelease

      - name: AAB de release
        run: ./gradlew bundleRelease

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            app/build/test-results/
            buildSrc/build/reports/
            app/schemas/
          if-no-files-found: ignore
