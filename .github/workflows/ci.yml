name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build e testes
    # Runner próprio: os minutos do Actions hospedado estão bloqueados na conta.
    # Precisa estar registrado neste repositório (Settings > Actions > Runners).
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        # Git Bash no Windows, bash no Linux/macOS: o mesmo ./gradlew nos dois.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Instala (ou reaproveita) o Android SDK e a plataforma do compileSdk.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;36.0.0"

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build
        run: ./gradlew assembleDebug

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
