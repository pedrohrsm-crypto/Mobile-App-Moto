name: CI

on:
  pull_request:
    # "edited": corrigir o corpo do PR reexecuta o CI (a conferência das provas negativas lê o corpo).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, build e testes
    # Actions hospedado (decisão #10); plano B, se a cobrança da conta bloquear: runner próprio.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Datas e fusos dos testes sempre em UTC, igual em qualquer runner.
      TZ: UTC
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico inteiro: a conferência das provas negativas faz diff contra a base do PR.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # A v6 liga por padrão o cache "enhanced", um serviço proprietário com termos próprios.
      # O "basic" mantém o cache da v4 (actions/cache, MIT), sem fornecedor novo (CLAUDE.md, fornecedor conferido).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Instala (ou reaproveita) o Android SDK e a plataforma do compileSdk.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: Guardas (idioma, cor, texto fixo)
        run: bash ferramentas/guardas.sh

      - name: Formatação (ktlint)
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSAO}/ktlint"
          # bash -e: sem o "|| status=$?", a falha encerraria o passo antes do echo e o log não mostraria os arquivos.
          status=0
          saida="$(java -jar "$RUNNER_TEMP/ktlint" "**/*.kt" "**/*.kts" "!**/build/**" 2>&1)" || status=$?
          [ -n "$saida" ] && echo "$saida"
          # Portão 2 do CLAUDE.md: exit 0 e saída vazia.
          [ "$status" -eq 0 ] && [ -z "$saida" ]
        env:
          KTLINT_VERSAO: 1.7.1

      - name: Testes dos scripts de ferramentas
        run: |
          bash ferramentas/testes/teto-aab.test.sh
          bash ferramentas/testes/provas-negativas.test.sh

      # Corpo do PR é entrada não confiável: só por env, nunca interpolado no run. Em push na main não há PR.
      # A base do diff é o primeiro pai do merge ref (HEAD^1, a main atual), calculada no script: a base.sha do
      # evento pode ser antiga e cobraria testes que a main ganhou depois.
      - name: Provas negativas citadas no corpo do PR
        if: github.event_name == 'pull_request'
        run: bash ferramentas/provas-negativas.sh
        env:
          CORPO_PR: ${{ github.event.pull_request.body }}

      - name: Testes do buildSrc
        run: ./gradlew -p buildSrc test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build
        run: ./gradlew assembleDebug

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest

      # Capturas commitadas = capturas do código. Diferença reprova no verify; captura nova ou alterada sem commit, no git status.
      - name: Capturas do Roborazzi
        run: |
          ./gradlew verifyRoborazziDebug
          mudancas="$(git status --porcelain -- app/src/test/snapshots)"
          if [ -n "$mudancas" ]; then
            echo "app/src/test/snapshots/ difere do commitado; rode ./gradlew recordRoborazziDebug e commite:"
            echo "$mudancas"
            exit 1
          fi

      - name: Manifesto do release
        run: ./gradlew verificarManifestoRelease

      - name: AAB de release
        run: ./gradlew bundleRelease

      - name: Teto do AAB
        run: bash ferramentas/teto-aab.sh

      # O build regera app/schemas/. Schema alterado, novo ou apagado sem commit reprova (regra da segunda ocorrência, decisão #12).
      - name: Schema do Room commitado
        run: |
          mudancas="$(git status --porcelain -- app/schemas)"
          if [ -n "$mudancas" ]; then
            echo "app/schemas/ difere do commitado depois do build; rode ./gradlew assembleDebug e commite:"
            echo "$mudancas"
            exit 1
          fi

      # APK de release assinado (#63): só no push na main. Em PR (inclusive Dependabot e fork) estes passos não rodam,
      # o release segue sem assinatura e o AAB do teto acima nunca é assinado (as variáveis só existem nestes passos).
      # Segredo só por env, nunca interpolado no run; nenhum valor é impresso, só os nomes do que falta.
      - name: Segredos da assinatura
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        run: |
          faltando=()
          for nome in MOTO_KEYSTORE_BASE64 MOTO_KEYSTORE_PASSWORD MOTO_KEY_ALIAS MOTO_KEY_PASSWORD; do
            [ -n "${!nome}" ] || faltando+=("$nome")
          done
          if [ "${#faltando[@]}" -gt 0 ]; then
            echo "::error::Faltam segredos da assinatura do release: ${faltando[*]}. Cadastre em Settings > Secrets and variables > Actions; sem eles não sai APK de release."
            exit 1
          fi
          # Fora do repositório: o keystore temporário nunca entra no checkout nem no artefato.
          printf '%s' "$MOTO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moto-release.keystore"
        env:
          MOTO_KEYSTORE_BASE64: ${{ secrets.MOTO_KEYSTORE_BASE64 }}
          MOTO_KEYSTORE_PASSWORD: ${{ secrets.MOTO_KEYSTORE_PASSWORD }}
          MOTO_KEY_ALIAS: ""
          MOTO_KEY_PASSWORD: ${{ secrets.MOTO_KEY_PASSWORD }}

      - name: APK de release assinado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease
        env:
          MOTO_KEYSTORE_PATH: ${{ runner.temp }}/moto-release.keystore
          MOTO_KEYSTORE_PASSWORD: ${{ secrets.MOTO_KEYSTORE_PASSWORD }}
          MOTO_KEY_ALIAS: ${{ secrets.MOTO_KEY_ALIAS }}
          MOTO_KEY_PASSWORD: ${{ secrets.MOTO_KEY_PASSWORD }}

      # Do apksigner, só a impressão digital SHA-256 vai para o log (o DN e os outros resumos ficam de fora).
      - name: Assinatura do APK
        id: apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk não existe: o release saiu sem assinatura."
            ls app/build/outputs/apk/release/ || true
            exit 1
          fi
          status=0
          saida="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" 2>&1)" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::apksigner verify reprovou o APK (exit $status)."
            exit 1
          fi
          echo "$saida" | grep -E 'certificate SHA-256 digest' || { echo "::error::apksigner não imprimiu a impressão digital SHA-256."; exit 1; }
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Artefato do APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: diario-de-bordo-release-${{ steps.apk.outputs.sha7 }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Apagar o keystore temporário
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -f "$RUNNER_TEMP/moto-release.keystore"

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
            buildSrc/build/reports/
            app/schemas/
          if-no-files-found: ignore
